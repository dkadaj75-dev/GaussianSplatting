name: CI

# Lint + tests for the three packages of the monorepo (Milestone 0, WP 0.4).
# Each job is independent, so a red worker never hides a green web build.

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch cancels the previous, still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # `python -m` puts api/ on sys.path so `import app` resolves.
        run: python -m pytest

  worker:
    name: worker (Celery pipeline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test (pytest)
        # FakeBackend only — no Redis, COLMAP or GPU needed.
        run: python -m pytest

  web:
    name: web (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest)
        run: npm run test

      - name: Build (tsc + vite)
        run: npm run build
