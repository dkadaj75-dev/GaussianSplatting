<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SplatScene Field Demo</title>
    <style>
      /* This page is a viewfinder onto a renderer that clears to near-black, so
         it commits to a single dark world rather than switching themes — light
         chrome around a black canvas fights the subject. Every colour is
         painted explicitly so the page holds on either host ground. */
      :root {
        --ground: #070a0f;
        --surface: #10151d;
        --raised: #171e28;
        --line: #232d3a;
        --text: #e6edf5;
        --muted: #8a99ac;
        /* Measurement green and calibration amber are the badge semantics from
           the plan, not decoration: green means the scene has real scale. */
        --accent: #4ade80;
        --warn: #fbbf24;
        --info: #60a5fa;
        --danger: #f87171;

        --ui: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --data: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

        --touch: 2.75rem;
        --radius: 0.6rem;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--ground);
        color: var(--text);
        font-family: var(--ui);
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
      }

      /* ---------------------------------------------------------- stage */

      .stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        background: var(--ground);
        touch-action: none;
      }

      .canvas-host {
        position: absolute;
        inset: 0;
      }

      .canvas-host canvas {
        display: block;
      }

      .overlay-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .label {
        position: absolute;
        top: 0;
        left: 0;
        padding: 0.2rem 0.45rem;
        border: 1px solid var(--line);
        border-radius: 0.4rem;
        background: rgba(7, 10, 15, 0.86);
        color: var(--text);
        font-family: var(--data);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        transition: opacity 120ms linear;
      }

      .crosshair {
        position: fixed;
        top: 0;
        left: 0;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        border: 1px solid rgba(96, 165, 250, 0.5);
        pointer-events: none;
        opacity: 0;
        transition: opacity 140ms linear;
      }

      .crosshair::before,
      .crosshair::after {
        content: '';
        position: absolute;
        background: rgba(96, 165, 250, 0.8);
      }

      .crosshair::before {
        top: 50%;
        left: 25%;
        width: 50%;
        height: 1px;
      }

      .crosshair::after {
        left: 50%;
        top: 25%;
        height: 50%;
        width: 1px;
      }

      .crosshair.visible {
        opacity: 1;
      }

      .status-card {
        position: absolute;
        left: 50%;
        top: 1rem;
        transform: translateX(-50%);
        max-width: min(92%, 30rem);
        padding: 0.55rem 0.85rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: rgba(16, 21, 29, 0.94);
        color: var(--text);
        font-size: 0.85rem;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms linear;
      }

      .status-card.visible {
        opacity: 1;
      }

      .status-card.error {
        border-color: color-mix(in srgb, var(--danger) 55%, var(--line));
        color: var(--danger);
      }

      /* ---------------------------------------------------------- panel */

      .panel {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        padding: 0.85rem 0.9rem calc(0.85rem + env(safe-area-inset-bottom));
        background: var(--surface);
        border-top: 1px solid var(--line);
        max-height: 46dvh;
        overflow-y: auto;
      }

      .scene-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        align-items: center;
      }

      .chip {
        min-height: 2.2rem;
        padding: 0 0.8rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--raised);
        color: var(--muted);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .chip.active {
        border-color: color-mix(in srgb, var(--info) 60%, var(--line));
        color: var(--text);
        background: color-mix(in srgb, var(--info) 14%, var(--raised));
      }

      .badge {
        margin-left: auto;
        min-height: 2.2rem;
        padding: 0 0.75rem;
        border-radius: 999px;
        border: 1px solid;
        background: transparent;
        font: inherit;
        font-size: 0.78rem;
        cursor: pointer;
      }

      .badge.warn {
        border-color: color-mix(in srgb, var(--warn) 45%, var(--line));
        color: var(--warn);
      }

      .badge.ok {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
        color: var(--accent);
      }

      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.45;
        text-wrap: pretty;
      }

      .toolbar {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.45rem;
      }

      .tool {
        min-height: var(--touch);
        padding: 0 0.5rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--raised);
        color: var(--text);
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .tool:hover {
        border-color: color-mix(in srgb, var(--text) 22%, var(--line));
      }

      .tool.primary.active,
      .tool.active {
        border-color: color-mix(in srgb, var(--accent) 60%, var(--line));
        background: color-mix(in srgb, var(--accent) 16%, var(--raised));
        color: var(--accent);
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.45rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--raised);
      }

      .row-label {
        font-family: var(--data);
        font-size: 0.78rem;
        color: var(--muted);
      }

      .row-value {
        font-family: var(--data);
        font-size: 0.9rem;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
      }

      .row-remove {
        margin-left: auto;
        min-height: 2rem;
        padding: 0 0.65rem;
        border: 1px solid var(--line);
        border-radius: 0.45rem;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.78rem;
        cursor: pointer;
      }

      .row-remove:hover {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 45%, var(--line));
      }

      /* ---------------------------------------------------------- sheet */

      .sheet {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translate(-50%, 110%);
        width: min(100%, 28rem);
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
        background: var(--surface);
        border: 1px solid var(--line);
        border-bottom: none;
        border-radius: 1rem 1rem 0 0;
        transition: transform 200ms cubic-bezier(0.2, 0.7, 0.3, 1);
        z-index: 20;
      }

      .sheet.open {
        transform: translate(-50%, 0);
      }

      .sheet h2 {
        margin: 0;
        font-size: 1rem;
        letter-spacing: 0.01em;
      }

      .sheet-body {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.45;
      }

      .sheet-row {
        display: flex;
        gap: 0.5rem;
      }

      .sheet-input,
      .sheet-unit {
        min-height: var(--touch);
        padding: 0 0.7rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--ground);
        color: var(--text);
        font-family: var(--data);
        font-size: 1rem;
      }

      .sheet-input {
        flex: 1 1 auto;
        min-width: 0;
      }

      .sheet-error {
        margin: 0;
        min-height: 1rem;
        color: var(--danger);
        font-size: 0.8rem;
      }

      .sheet-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--info);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }

      /* Wider screens: the scene keeps the room, controls move to a rail. */
      @media (min-width: 52rem) {
        #app {
          flex-direction: row;
        }

        .panel {
          width: 22rem;
          max-height: none;
          border-top: none;
          border-left: 1px solid var(--line);
          padding-bottom: 1rem;
        }

        .sheet {
          left: auto;
          right: 0;
          transform: translate(0, 110%);
          width: 22rem;
        }

        .sheet.open {
          transform: translate(0, 0);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
