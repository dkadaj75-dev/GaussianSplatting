# SplatScene — full local stack.
#
#   docker compose up --build
#
# Wiring (WP 0.4): the API dispatches `worker.run_pipeline` onto the Redis
# broker by task name, the worker publishes JSON progress on `jobs:{job_id}`,
# and the API's Redis→WebSocket bridge republishes those events to
# `/ws/jobs/{job_id}`. Photos and artifacts live on one shared volume so the
# worker reads what the API wrote.
#
#   browser ──REST──> api ──send_task──> redis ──> worker
#   browser <──WS──── api <──jobs:*───── redis <── worker

services:
  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      # The browser talks to the API directly; keep in sync with api CORS_ORIGINS.
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////srv/api/data/splatscene.db
      STORAGE_DIR: /srv/api/data/photos
      CORS_ORIGINS: http://localhost:5173
      REDIS_URL: redis://redis:6379/0
      # Dispatch jobs to the Celery worker by task name (worker.run_pipeline).
      QUEUE_MODE: celery
      # Subscribe to the worker's jobs:* progress channels and republish them
      # onto /ws/jobs/{id}.
      EVENT_SOURCE: redis
      # Dev helper endpoints (POST /api/dev/jobs/{id}/advance). Set to 0 for
      # anything resembling a real deployment.
      DEV_MODE: "1"
    volumes:
      - splat-data:/srv/api/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./worker
    environment:
      # Broker, result backend and progress pub/sub — one Redis for all three.
      REDIS_URL: redis://redis:6379/0
      # Same root as the API's STORAGE_DIR: the worker reads the uploaded
      # photos at {STORAGE_DIR}/{project_id}/ and writes job artifacts under
      # {STORAGE_DIR}/projects/{project_id}/jobs/{job_id}/output/.
      STORAGE_DIR: /srv/api/data/photos
      # `fake` produces placeholder artifacts without COLMAP/OpenSplat; Milestone 2
      # flips this to `real` on a GPU-capable image.
      PIPELINE_BACKEND: fake
    volumes:
      # Worker and API share the photo/artifact volume on a single node.
      - splat-data:/srv/api/data
    depends_on:
      redis:
        condition: service_healthy

  worker-cpu:
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: infra/worker.cpu.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /srv/api/data/photos
      PIPELINE_BACKEND: real
      COLMAP_SIFT_USE_GPU: "0"
    volumes:
      - splat-data:/srv/api/data
    depends_on:
      redis:
        condition: service_healthy

  worker-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: infra/worker.gpu.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /srv/api/data/photos
      PIPELINE_BACKEND: real
      # Jammy apt COLMAP is not CUDA-enabled. Enable only after replacing it
      # with a CUDA-enabled COLMAP build.
      COLMAP_SIFT_USE_GPU: "0"
    volumes:
      - splat-data:/srv/api/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  redis:
    # Pinned to 7.2 — the last BSD-licensed release (PLAN.md §6). Do not bump
    # to >= 7.4 (RSAL/SSPL); switch to valkey/valkey if a newer engine is needed.
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  splat-data:
  redis-data:
